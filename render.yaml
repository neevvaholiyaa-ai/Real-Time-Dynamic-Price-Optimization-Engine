services:
  - type: web
    name: auraprice-dynamic-pricing
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: JWT_SECRET_KEY
        generateValue: true
